spring.application.name=clinica

#PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Exceptions
server.error.include-stacktrace=never

# Chave secreta para assinatura dos Tokens JWT
jwt.secret=${JWT_SECRET}

# ===================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa o Open-In-View para melhorar a performance e fechar as conexões mais cedo
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURAÇÕES DE PAGINAÇÃO DA API
# ===================================================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===================================================================
# CONFIGURAÇÕES DE ERROS E SEGURANÇA (JWT)
# ===================================================================
# Esconde o Stacktrace completo nas respostas HTTP para segurança da API
server.error.include-stacktrace=never

# ===================================================================
# CONFIGURAÇÕES CUSTOMIZADAS DO SWAGGER / SPRINGDOC
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html